<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MairaAI</title>
<style>
body{margin:0;font-family:sans-serif;background:#0f0f12;color:white;display:flex;flex-direction:column;height:100vh}
header{padding:16px;text-align:center;font-size:22px;font-weight:bold;background:#1a1a22;border-bottom:1px solid #333}
#chat{flex:1;overflow-y:auto;padding:15px}
.msg{margin:10px 0;padding:12px 16px;border-radius:18px;max-width:80%}
.user{background:#6c5ce7;margin-left:auto}
.ai{background:#2d2d3a}
#inputBox{display:flex;padding:10px;background:#1a1a22}
input{flex:1;padding:12px;border-radius:25px;border:none;background:#2d2d3a;color:white;outline:none}
button{margin-left:8px;padding:12px 20px;border-radius:25px;border:none;background:#6c5ce7;color:white;font-weight:bold}
</style>
</head>
<body>
<header>✨ MairaAI</header>
<div id="chat"><div class="msg ai">হ্যালো! আমি MairaAI. বলো কি সাহায্য করবো?</div></div>
<div id="inputBox">
<input id="inp" placeholder="কিছু লেখো...">
<button onclick="send()">Send</button>
</div>
<script>
function send(){
let i=document.getElementById('inp');
if(!i.value)return;
let c=document.getElementById('chat');
c.innerHTML+=`<div class="msg user">${i.value}</div>`;
setTimeout(()=>{c.innerHTML+=`<div class="msg ai">MairaAI: তোমার কথা পেলাম - "${i.value}"। আমি এখন ডেভেলপমেন্ট মোডে আছি। খুব শীঘ্রই ফুল AI কানেক্ট হবে!</div>`;c.scrollTop=c.scrollHeight},500);
i.value='';c.scrollTop=c.scrollHeight;
}
</script>
</body>
</html>
